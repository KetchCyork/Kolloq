<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
  <!-- Kolloq wordmark lockup — council ring + "kolloq" wordmark, self-contained on navy. The brand kit
       shipped one lockup (NEW-243); it doubles as both the dark- and light-surface variant since its
       own navy background travels with it rather than compositing onto the page background. -->
  <defs>
    <linearGradient id="ring" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
  </defs>
  <rect width="900" height="400" fill="#0b1220"/>
  <circle cx="200" cy="200" r="105" fill="none" stroke="url(#ring)" stroke-width="10" stroke-dasharray="92 40" stroke-linecap="round" transform="rotate(-90 200 200)"/>
  <g fill="url(#ring)">
    <circle cx="200" cy="95" r="17"/>
    <circle cx="300" cy="168" r="17"/>
    <circle cx="262" cy="285" r="17"/>
    <circle cx="138" cy="285" r="17"/>
    <circle cx="100" cy="168" r="17"/>
  </g>
  <text x="200" y="248" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="130" fill="#ffffff">k</text>
  <text x="380" y="245" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="120" fill="#ffffff" letter-spacing="-2">kolloq</text>
</svg>
