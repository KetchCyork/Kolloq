name: Desktop release

# Builds signed installers for macOS (.dmg), Windows (.msi/.exe), and Linux
# (.AppImage/.deb) and publishes them to a GitHub Release, with a latest.json
# manifest for the Tauri auto-updater.
#
# Requires this repository secret for every release build (the job fails fast
# without it, rather than shipping a binary with the feature disabled):
#   VITE_GOOGLE_OAUTH_CLIENT_SECRET      - Google OAuth Client Secret; Vite inlines
#                                          it into the bundle at build time, and
#                                          "Continue with Google" is disabled without it
#
# Requires these repository secrets to produce SIGNED artifacts (see
# apps/desktop/README.md for how to generate each one):
#   TAURI_SIGNING_PRIVATE_KEY            - updater signing key (tauri signer generate)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD   - password for the above, if set
#   APPLE_CERTIFICATE                    - base64 .p12 Developer ID Application cert
#   APPLE_CERTIFICATE_PASSWORD           - password for the .p12
#   APPLE_SIGNING_IDENTITY                - e.g. "Developer ID Application: New Vector AI (TEAMID)"
#   APPLE_ID                             - Apple ID used for notarization
#   APPLE_PASSWORD                       - app-specific password for the Apple ID
#   APPLE_TEAM_ID                        - Apple Developer Team ID
#
# Windows signing uses Azure Trusted Signing (publicly-trusted Windows certs
# have required HSM-backed key storage since 2023, ruling out a plain
# downloadable .pfx for CI) via the `trusted-signing-cli` tool, which is
# installed on the Windows runner and invoked by Tauri's bundler as a custom
# windows.signCommand. It needs:
#   AZURE_TENANT_ID                      - Azure AD tenant ID
#   AZURE_CLIENT_ID / AZURE_CLIENT_SECRET - service principal with the
#                                          "Trusted Signing Certificate
#                                          Profile Signer" role on the
#                                          Trusted Signing account
#   AZURE_TRUSTED_SIGNING_ACCOUNT        - Trusted Signing account name
#   AZURE_TRUSTED_SIGNING_ENDPOINT       - account's region endpoint URL
#   AZURE_TRUSTED_SIGNING_CERT_PROFILE   - the certificate PROFILE name (the
#                                          short identifier chosen when
#                                          creating the profile in the Azure
#                                          Portal) - NOT the certificate
#                                          Subject/DN
#
# trusted-signing-cli (as of 0.11.0) does NOT use the Azure SDK's
# EnvironmentCredential - it shells out to `az login --service-principal`
# using the installed Azure CLI, then to `signtool.exe`, and both tool paths
# default to hardcoded locations (`C:\Program Files\Microsoft SDKs\Azure\CLI2\
# wbin\az.cmd` and a specific Windows SDK version under `Windows Kits\10\bin`)
# that can drift out from under `windows-latest`. The "Resolve Windows signing
# tool paths" step below finds the actual installed paths at build time and
# passes them via AZURE_CLI_PATH / SIGNTOOL_PATH (both read by
# trusted-signing-cli's env fallbacks) instead of trusting the defaults.
#
# Tauri's bundler also swallows trusted-signing-cli's stdout/stderr on
# failure - the whole thing collapses to "failed to run trusted-signing-cli"
# with no indication of *why*. The `-v` flag on the Windows build step below
# bumps the bundler's own logger to debug, which does print the captured
# output, so a real signing failure is diagnosable in the Actions log instead
# of being a black box.
#
# Without these secrets the workflow still builds *unsigned* installers (Tauri
# falls back gracefully), which is fine for internal test builds but should
# not be distributed publicly - unsigned macOS/Windows builds trigger Gatekeeper
# and SmartScreen warnings.

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

# The repo's default GITHUB_TOKEN permissions are read-only (Settings > Actions
# > General > Workflow permissions), so every job that creates/updates the
# draft release or uploads installer assets to it needs contents:write
# explicitly - without this the first API call 403s with "Resource not
# accessible by integration" before any platform build even starts.
permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      # Fail before the draft release exists (and before ~20 min of Rust builds)
      # if a build-time secret is missing. Vite bakes VITE_ vars in at build time,
      # so a missing one produces a silently degraded binary, not a build error.
      - name: Preflight - required build secrets
        shell: bash
        env:
          VITE_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          if [ -z "${VITE_GOOGLE_OAUTH_CLIENT_SECRET}" ]; then
            echo "::error::Repository secret VITE_GOOGLE_OAUTH_CLIENT_SECRET is not set. Google sign-in would ship disabled. Add it with: gh secret set VITE_GOOGLE_OAUTH_CLIENT_SECRET --repo ${{ github.repository }}"
            exit 1
          fi
          echo "All required build secrets are present."

      - name: Create draft release
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            // A tag push gives a real `desktop-v*` tag to release under. A
            // manual workflow_dispatch run (e.g. to test a CI fix without
            // cutting a release) has no tag - context.ref is refs/heads/<branch>
            // in that case, and GitHub rejects tag names starting with
            // "refs/" once publish-release tries to un-draft the release.
            // Fall back to a synthetic, run-scoped tag so dispatch runs still
            // produce a valid (if throwaway) draft release.
            const isTagPush = context.eventName === 'push' && context.ref.startsWith('refs/tags/');
            const tag_name = isTagPush
              ? context.ref.replace('refs/tags/', '')
              : `desktop-manual-${context.runNumber}`;
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name,
              name: isTagPush ? `Open Work ${tag_name.replace('desktop-v', '')}` : `Open Work (manual run ${context.runNumber})`,
              draft: true,
              prerelease: !isTagPush,
            });
            return data.id;

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential libssl-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install trusted-signing-cli
        # Only attempt Windows signing once every credential it needs is
        # present - a partial set would build a broken signCommand (e.g. an
        # empty -c) and fail the whole release instead of falling back to an
        # unsigned build like the other platforms do when secrets are absent.
        if: >-
          matrix.platform == 'windows-latest' &&
          env.AZURE_TRUSTED_SIGNING_ACCOUNT != '' &&
          env.AZURE_TRUSTED_SIGNING_ENDPOINT != '' &&
          env.AZURE_TRUSTED_SIGNING_CERT_PROFILE != '' &&
          env.AZURE_TENANT_ID != '' &&
          env.AZURE_CLIENT_ID != '' &&
          env.AZURE_CLIENT_SECRET != ''
        id: trusted-signing-cli
        env:
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_CERT_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERT_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        shell: bash
        run: |
          cargo install trusted-signing-cli --locked
          echo "installed=true" >> "$GITHUB_OUTPUT"

      - name: Resolve Windows signing tool paths
        # trusted-signing-cli's --azure-cli-path/--sign-tool-path defaults are
        # hardcoded to specific install locations that can drift across
        # windows-latest image updates. Find what's actually on this runner
        # instead of trusting the defaults; if either lookup comes up empty,
        # the env: block below falls back to the tool's own hardcoded default
        # rather than exporting an empty path.
        if: steps.trusted-signing-cli.outputs.installed == 'true'
        id: signing-paths
        shell: pwsh
        run: |
          $az = (Get-Command az.cmd -ErrorAction SilentlyContinue).Source
          if (-not $az) { $az = (Get-Command az -ErrorAction SilentlyContinue).Source }
          if ($az) { Write-Host "Resolved az CLI: $az" } else { Write-Host "::warning::az CLI not found on PATH" }
          echo "az_path=$az" >> $env:GITHUB_OUTPUT

          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object { [version]($_.Directory.Parent.Name) } -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if ($signtool) { Write-Host "Resolved signtool: $signtool" } else { Write-Host "::warning::signtool.exe not found under Windows Kits 10" }
          echo "sign_tool_path=$signtool" >> $env:GITHUB_OUTPUT

      - name: Build and release (macOS/Linux)
        if: matrix.platform != 'windows-latest'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Inlined into the web bundle by Vite via tauri.conf.json's
          # beforeBuildCommand; RELEASE_BUILD makes vite.config.ts hard-fail
          # rather than emit a bundle with Google sign-in disabled.
          RELEASE_BUILD: "1"
          VITE_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_OAUTH_CLIENT_SECRET }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

      - name: Build and release (Windows)
        if: matrix.platform == 'windows-latest'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BUILD: "1"
          VITE_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_OAUTH_CLIENT_SECRET }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Read by trusted-signing-cli when Tauri's bundler shells out to the
          # windows.signCommand below (az login --service-principal).
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          # Overrides trusted-signing-cli's hardcoded default tool paths. GitHub
          # Actions env: always sets the key (even to ""), which clap treats as
          # an explicit empty value rather than "unset" - so fall back to the
          # tool's own hardcoded defaults verbatim when resolution above found
          # nothing, instead of exporting an empty string.
          AZURE_CLI_PATH: ${{ steps.signing-paths.outputs.az_path || 'C:\Program Files\Microsoft SDKs\Azure\CLI2\wbin\az.cmd' }}
          SIGNTOOL_PATH: ${{ steps.signing-paths.outputs.sign_tool_path || 'C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\signtool.exe' }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: >-
            -v
            ${{ steps.trusted-signing-cli.outputs.installed == 'true' && format('--config {{"bundle":{{"windows":{{"signCommand":"trusted-signing-cli -e {0} -a {1} -c {2} %1"}}}}}}', secrets.AZURE_TRUSTED_SIGNING_ENDPOINT, secrets.AZURE_TRUSTED_SIGNING_ACCOUNT, secrets.AZURE_TRUSTED_SIGNING_CERT_PROFILE) || '' }}

  publish-release:
    needs: [create-release, build]
    # Publish even when a build leg fails (e.g. Windows code signing, tracked
    # separately in NEW-43) so a green macOS/Linux build still reaches users
    # instead of sitting in an unpublished draft forever. Only skip if the run
    # was cancelled or the draft was never created.
    if: ${{ !cancelled() && needs.create-release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const release_id = ${{ needs.create-release.outputs.release_id }};
            // Never promote a draft that's missing the macOS build — a release
            // that looks published but has no .dmg is worse than an unpublished
            // one. Require the aarch64 dmg before flipping draft:false.
            const { data: assets } = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id,
            });
            const names = assets.map((a) => a.name);
            const hasMacDmg = names.some((n) => n.endsWith('aarch64.dmg'));
            if (!hasMacDmg) {
              core.setFailed(
                `Refusing to publish: draft ${release_id} has no macOS .dmg (assets: ${names.join(', ') || 'none'}).`,
              );
              return;
            }
            core.info(`Publishing release ${release_id} with assets: ${names.join(', ')}`);
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id,
              draft: false,
            });
